<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#bce9fb" />
  <link rel="preload" as="image" href="hachiware-blue-card.jpg" fetchpriority="high" />
  <title>小八约会邀请</title>
  <style>
    :root{--bg:#dff5ff;--bg2:#bce9fb;--blue:#469bd0;--navy:#206897;--sky:#ccefff;--soft:#78a9c8;--white:#f8fdff;--shade:rgba(32,104,151,.22)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--navy);font-family:"Microsoft YaHei",system-ui,sans-serif}.screen{display:none;width:100%;height:100%;align-items:center;justify-content:center;padding:20px 16px;text-align:center}.screen.active{display:flex}.card{width:100%;max-width:380px;animation:in .35s steps(4) both}@keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}.art{display:block;width:180px;height:150px;object-fit:cover;margin:0 auto 16px;border:4px solid var(--blue);box-shadow:3px 3px 0 var(--shade);image-rendering:pixelated;animation:hop 1.05s steps(3,end) infinite}@keyframes hop{0%,100%{transform:translateY(4px) scale(.98)}50%{transform:translateY(-6px) scale(1.02)}}h1{font-size:22px;line-height:1.5;color:var(--navy)}.sub{margin-top:6px;color:var(--soft);font-size:14px}.row{display:flex;align-items:center;justify-content:center;gap:34px;min-height:60px;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:14px 28px;border:3px solid var(--navy);border-radius:0;background:var(--blue);box-shadow:3px 3px 0 var(--shade);color:#fff;cursor:pointer;font:800 19px inherit}.btn:active{transform:translate(3px,3px);box-shadow:none}.yes,.no{position:relative;transition:transform .45s ease}.yes{z-index:10;font-family:monospace}.no{padding:14px 23px;background:var(--sky);color:var(--navy);font:800 14px monospace;transition:transform .25s ease}.hint{min-height:24px;margin-top:14px;color:var(--navy);font-weight:700;transition:margin .25s}.yay{margin:10px 0;color:var(--navy);font-size:40px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.activity{display:grid;min-height:70px;place-content:center;gap:5px;border:3px solid #78c5e9;background:var(--white);box-shadow:3px 3px 0 var(--shade);color:var(--navy);cursor:pointer;font:inherit}.activity b{font-size:14px}.activity.sel{border-color:var(--navy);background:var(--sky)}.lock{cursor:not-allowed;border-color:#a4c5d8;background:#dff3fc;color:#98b8c9}.calendar{width:min(290px,100%);margin:16px auto 0;border:3px solid var(--navy);background:var(--white);box-shadow:3px 3px 0 var(--shade);padding:12px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.arrow{width:27px;height:27px;border:2px solid #78c5e9;background:var(--sky);color:var(--navy);font-size:16px;cursor:pointer}.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dates span{padding:4px 0;color:var(--soft);font-size:11px}.dates button{min-height:27px;border:0;background:none;color:var(--navy);cursor:pointer;font:inherit}.dates button.today{font-weight:900}.dates button.pick{background:var(--blue);color:white;font-weight:900}.letter{border:3px solid var(--navy);background:#eefaff;box-shadow:3px 3px 0 var(--shade);text-align:left}.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;font-weight:800;font-size:14px}.close{width:20px;height:20px;border:1px solid white;background:#4a96c3;color:#fff;cursor:pointer}.letter article{padding:18px 17px 14px;font-size:16px;line-height:1.65}.letter p{margin-bottom:12px}.sign{text-align:right;font-style:italic}.status{min-height:22px;margin-top:12px;color:#367a9d;font-size:14px}.again{margin-top:16px;border:0;background:none;color:var(--blue);cursor:pointer;text-decoration:underline;font:13px inherit}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-10px;width:10px;height:16px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:360px){.screen{padding:12px 9px}.row{gap:19px}.btn{font-size:17px}.no{padding:14px 16px;font-size:12px}.art{width:156px;height:130px}h1{font-size:20px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <section class="screen active" id="one"><div class="card"><img class="art" src="hachiware-blue-card.jpg" alt="抱花的小八" decoding="async" fetchpriority="high" /><h1>你愿意跟我出去吗？</h1><div class="row"><button class="btn yes" id="yes">YES</button><button class="btn no" id="no">No</button></div><p class="hint" id="hint">你确定吗？</p></div></section>
  <section class="screen" id="two"><div class="card"><img class="art" src="hachiware-blue-card.jpg" alt="抱花的小八" decoding="async" /><p class="yay">耶！</p><h1 style="font-size:18px">你答应我，我真的好开心。</h1><div class="row"><button class="btn" id="goActs">按一下继续 →</button></div></div></section>
  <section class="screen" id="three"><div class="card"><img class="art" src="hachiware-blue-card.jpg" alt="抱花的小八" decoding="async" /><h1>你想一起做什么？</h1><p class="sub">选一个你想和我一起做的</p><div class="grid" id="activities"></div><div class="row"><button class="btn lock" id="goDate" disabled>就决定是这个了 🔒</button></div></div></section>
  <section class="screen" id="four"><div class="card"><img class="art" src="hachiware-blue-card.jpg" alt="抱花的小八" decoding="async" /><h1>挑一天约会吧</h1><p class="sub">选一天，安排我们的小小约会吧。</p><div class="calendar"><div class="calhead"><button class="arrow" id="prev">‹</button><b id="month"></b><button class="arrow" id="next">›</button></div><div class="dates" id="dates"></div></div><div class="row"><button class="btn lock" id="goLetter" disabled>继续 →</button></div></div></section>
  <section class="screen" id="five"><div class="card"><div class="letter"><div class="bar"><span>❤ 情书.txt</span><button class="close" id="close">×</button></div><article><p>那就一直说明天见<br />直到真的明天见</p><p class="sign">约会快乐 ❤️❤️❤️</p></article></div><button class="btn" style="width:100%;margin-top:16px" id="send">就这样约了！💌</button><p class="status" id="status"></p><button class="again" id="again">再看一次</button></div></section>
  <script>
    (()=>{
      const ids=['one','two','three','four','five'],show=id=>ids.forEach(x=>document.getElementById(x).classList.toggle('active',x===id));
      const $=id=>document.getElementById(id);let tries=0,yesScale=1,noScale=1,activity='',picked='',year=new Date().getFullYear(),month=new Date().getMonth();
      const hints=['宝贝拜托 :C','还是选好啦！','不要这样啦','我要哭了……','认真考虑一下嘛'];
      function party(){const box=document.createElement('div');box.className='confetti';for(let i=0;i<34;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${['#469bd0','#78c5e9','#ffe082','#ccefff'][i%4]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;box.appendChild(p)}document.body.appendChild(box);setTimeout(()=>box.remove(),4600)}
      $('yes').onclick=()=>{party();show('two')};$('no').onclick=()=>{tries++;yesScale*=1.3;noScale=Math.max(noScale*.85,.25);$('yes').style.transform=`scale(${yesScale})`;$('no').style.transform=`scale(${noScale})`;$('hint').textContent=tries>=8?'好啦好啦，快按 YES 啦 ❤':hints[(tries-1)%hints.length];$('hint').style.marginTop=14+Math.min(tries,5)*14+'px'};
      $('goActs').onclick=()=>show('three');const activities=[['吃饭约会','🍽️'],['看电影','🎬'],['咖啡散步','☕'],['野餐','🧺'],['爬山','⛰️'],['给你决定','🎁'],['健身','🏋️'],['DIY 手作','🧵']];activities.forEach(([name,icon])=>{const b=document.createElement('button');b.className='activity';b.innerHTML=`<span>${icon}</span><b>${name}</b>`;b.onclick=()=>{document.querySelectorAll('.activity').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');activity=name;$('goDate').disabled=false;$('goDate').classList.remove('lock');$('goDate').textContent='就决定是这个了'};$('activities').appendChild(b)});$('goDate').onclick=()=>show('four');
      function drawCalendar(){const grid=$('dates');grid.innerHTML='';$('month').textContent=`${year}-${String(month+1).padStart(2,'0')}`;['日','一','二','三','四','五','六'].forEach(x=>{const e=document.createElement('span');e.textContent=x;grid.appendChild(e)});const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),today=new Date();for(let i=0;i<first;i++)grid.appendChild(document.createElement('span'));for(let d=1;d<=days;d++){const b=document.createElement('button'),key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;b.textContent=d;if(today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d)b.classList.add('today');if(key===picked)b.classList.add('pick');b.onclick=()=>{picked=key;$('goLetter').disabled=false;$('goLetter').classList.remove('lock');drawCalendar()};grid.appendChild(b)}}
      $('prev').onclick=()=>{month--;if(month<0){month=11;year--}drawCalendar()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}drawCalendar()};drawCalendar();$('goLetter').onclick=()=>show('five');let sending=false;$('send').onclick=async()=>{if(sending)return;sending=true;const button=$('send');button.disabled=true;button.textContent='正在发送…';$('status').textContent='';try{const form=new URLSearchParams({'_subject':'小八约会网站 · 新的约会选择','_template':'table','约会活动':activity,'约会日期':picked,'提交页面':location.href});const response=await fetch('https://formsubmit.co/ajax/2899251339@qq.com',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'},body:form});if(!response.ok)throw new Error('submission failed');$('status').textContent=`约定成立：${picked} · ${activity}，已发送给发起人。`;button.textContent='已发送 ❤';party()}catch(error){$('status').textContent='发送没有完成，请稍后再试。';button.disabled=false;button.textContent='就这样约了！💌'}finally{sending=false}};function reset(){tries=0;yesScale=noScale=1;activity=picked='';$('yes').style.transform='scale(1)';$('no').style.transform='scale(1)';$('hint').textContent='你确定吗？';$('hint').style.marginTop='14px';$('status').textContent='';$('send').disabled=false;$('send').textContent='就这样约了！💌';$('goDate').disabled=true;$('goDate').classList.add('lock');$('goLetter').disabled=true;$('goLetter').classList.add('lock');document.querySelectorAll('.activity').forEach(x=>x.classList.remove('sel'));show('one')}$('again').onclick=reset;$('close').onclick=reset;
    })();
  </script>
</body>
</html>
